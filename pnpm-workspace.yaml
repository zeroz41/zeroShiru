packages:
  - './*'

# webpack configs alias into the flat root node_modules (e.g. ../node_modules/
# bittorrent-tracker, ../node_modules/webrtc-polyfill), so hoisting is required.
# pnpm 11 no longer reads this from .npmrc.
shamefullyHoist: true

# matroska-metadata is a git dependency whose own dep (ebml-iterator) is also
# git-resolved; pnpm 11 blocks git-resolved subdeps by default.
blockExoticSubdeps: false

overrides:
  '@electron/universal': 3.0.4

patchedDependencies:
  '@capacitor/local-notifications': patches/@capacitor__local-notifications.patch
  '@capacitor/android': patches/@capacitor__android.patch
  'lucide-svelte@0.455.0': patches/lucide-svelte@0.455.0.patch
  rfdc: patches/rfdc.patch
  svelte-keybinds: patches/svelte-keybinds.patch
  cordova-plugin-apkupdater: patches/cordova-plugin-apkupdater.patch

onlyBuiltDependencies:
  - '@paymoapp/electron-shutdown-handler'
  - bufferutil
  - electron
  - electron-winstaller
  - fs-native-extensions
  - fsctl
  - ip-set
  - node-datachannel
  - sharp
  - utf-8-validate
  - utp-native
  - wrtc

allowBuilds:
  '@paymoapp/electron-shutdown-handler': true
  bufferutil: true
  electron-winstaller: true
  fsctl: true
  ip-set: true
  node-datachannel: true
  sharp: true
  utf-8-validate: true
  utp-native: true
  wrtc: true
  electron: true
  fs-native-extensions: true
