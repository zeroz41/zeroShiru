[package]
name = "shiru-torrent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# librqbit-backed engine + loopback media gateway; native hosts only
native = [
  "dep:librqbit",
  "dep:tokio",
  "dep:tokio-util",
  "dep:axum",
  "dep:rand",
  "dep:anyhow",
  "dep:reqwest",
  "dep:sha1",
  "dep:hex",
  "dep:serde_json",
]

[dependencies]
# rust-tls: keeps openssl out of the tree, which Android cross-builds cannot link
librqbit = { version = "9", optional = true, default-features = false, features = ["rust-tls", "http-api-client"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "time", "sync"], optional = true }
reqwest = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
rand = { version = "0.9", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
anyhow = { version = "1", optional = true }
serde = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
shiru-domain = { path = "../domain" }

[dev-dependencies]
reqwest = { workspace = true }
shiru-domain = { path = "../domain" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# the manual live smoke test: needs the real engine, so it only builds with it
[[example]]
name = "smoke"
required-features = ["native"]
