[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/platform-contracts",
  "crates/core",
  "crates/networking",
  "crates/debrid",
  "crates/torrent",
  "crates/sources",
  "crates/media",
  "crates/storage",
  "crates/credentials",
  "crates/wasm-bridge",
  "hosts/tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
sha1 = "0.10"
hex = "0.4"
tokio = { version = "1.47", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
