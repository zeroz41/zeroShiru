name: Feature Request
description: Suggest a new idea for this resource.
labels: ["enhancement"]
assignees: []
body:
  - type: checkboxes
    attributes:
      label: Which Platforms Should This Feature Apply To?
      description: Select all platforms where this feature would be relevant.
      options:
        - label: Android
        - label: Windows
        - label: Linux
        - label: macOS
    validations:
      required: true

  - type: dropdown
    attributes:
      label: How Important Is This Feature To You?
      description: Help us understand the impact this feature would have.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe The Feature
      description: A clear description of the feature you'd like to see added. Is it related to a problem you're experiencing?
      placeholder: I'd like the player diagnostics panel to expose dropped-frame and decoder information so playback problems are easier to report...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work? Be as specific as possible.
      placeholder: Add an optional diagnostics sheet in the player with copyable, credential-safe playback metrics...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I currently collect the same information from mpv logs, but that is difficult on Android...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other context or screenshots (highly recommended) about this request.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Checklist
      description: Let's make sure this report is valid.
      options:
        - label: I have searched the [issue tracker](https://github.com/zeroz41/zero/issues) and confirmed this feature has not been requested before.
          required: true
        - label: I ticked all of these boxes without actually reading them.
          required: false
        - label: I confirm that my request is **legal and lawful**, and does not promote or link to piracy or copyrighted material.
          required: true
