name: CI

on:
  push:
    branches: [zeroz-dev, master, 'feat/**', 'bug/**']
  pull_request:
    branches: [zeroz-dev, master]
  workflow_call:
  workflow_dispatch:
    inputs:
      live_tests:
        description: 'Also run live API tests (needs REAL_DEBRID_API_KEY / TORBOX_API_KEY secrets)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24.15.0'
  BUN_VERSION: '1.3.14'

jobs:
  # Unit tests: plain node:test, no native builds needed. Anything added under
  # test/unit/ is picked up automatically - see BUILDING.md.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (no native builds)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run unit tests
        run: npm test

  # Production webpack builds for both frontends. This is the real "does the
  # app still compile" check - it covers common/, client/ and each platform's
  # entry points without paying for electron-builder packaging.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: electron
            dir: electron
            command: npm run web:build
          - target: capacitor
            dir: capacitor
            command: npm run build:web
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        working-directory: ${{ matrix.dir }}
        env:
          NODE_ENV: production
        run: ${{ matrix.command }}

  # Shared Rust core: unit tests plus the wasm32 build the TV hosts depend on.
  rust:
    name: Rust Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build WASM core
        run: cargo build -p shiru-wasm-bridge --target wasm32-unknown-unknown --locked

  # Live API tests against real debrid services. Manual-only: they consume
  # account quota and need secrets, so they never run on push/PR. Tests are
  # env-gated and skip themselves when a service's key is absent.
  live-tests:
    name: Live API Tests
    if: github.event_name == 'workflow_dispatch' && inputs.live_tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (no native builds)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run live tests
        env:
          REAL_DEBRID_API_KEY: ${{ secrets.REAL_DEBRID_API_KEY }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
          RD_TEST_MAGNET: ${{ vars.RD_TEST_MAGNET }}
          RD_TEST_PACK_MAGNET: ${{ vars.RD_TEST_PACK_MAGNET }}
          RD_TEST_PACK_EPISODE: ${{ vars.RD_TEST_PACK_EPISODE }}
          TORBOX_TEST_HASH: ${{ vars.TORBOX_TEST_HASH }}
        run: npm run test:live
