name: Release

# Releases run two ways:
#   1. Push a tag like v6.8.1 (must match electron/package.json version).
#   2. Manual dispatch with the confirmation box ticked.
# Either way it runs full CI first, then drafts a GitHub Release and uploads
# one artifact set per platform: Windows (installer + portable), macOS
# (universal), Linux (AppImage) and Android (arm64 + armv7 APKs). Publishing
# the draft is a manual step on the Releases page - that is the moment users
# (and the in-app updater) can see it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_confirmed:
        description: 'I have verified the version in electron/package.json and confirm this release is intentional'
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: '24.15.0'
  PNPM_VERSION: '10.34.1'

jobs:
  # Releases are gated on the same CI that runs on every push.
  ci:
    if: ${{ github.event_name == 'push' || inputs.version_confirmed == true }}
    uses: ./.github/workflows/ci.yml

  prepare-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.read_version.outputs.app_version }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Read Release Version
        id: read_version
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          APP_VERSION="v$VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "App Version: $APP_VERSION"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "${{ steps.read_version.outputs.app_version }}" ]; then
            echo "::error::Tag $TAG does not match electron/package.json version ${{ steps.read_version.outputs.app_version }} - bump the version and re-tag."
            exit 1
          fi

      - name: Prepare GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.read_version.outputs.app_version }}"
          PRERELEASE_FLAG=""
          if [[ "$APP_VERSION" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$APP_VERSION" > /dev/null 2>&1; then
            echo "Release $APP_VERSION not found, creating draft..."
            gh release create "$APP_VERSION" --draft $PRERELEASE_FLAG --title "${APP_VERSION#v}" --notes ""
          else
            echo "Release $APP_VERSION already exists, skipping creation."
          fi

  release-desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Setuptools for Python (macOS only)
        if: runner.os == 'macOS'
        run: pip3 install setuptools --break-system-packages

      - name: Install dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Build and Publish
        working-directory: electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  release-android:
    name: Android
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}

    defaults:
      run:
        working-directory: ./capacitor

    steps:
      - name: Free Disk Space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null

      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install node-pre-gyp
        run: pnpm install -g node-pre-gyp

      - name: Build Native + Web
        run: pnpm run build:app

      - name: Build Android APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Stop Gradle Daemon
        run: cd android && ./gradlew --stop

      - name: Sign Android APK
        id: sign_app
        uses: RockinChaos/sign-android@v1.1.0
        with:
          releaseDir: capacitor/android/app/build/outputs/apk/release
          signingKey: "${{ secrets.SIGNING_KEY }}"
          keyAlias: "${{ secrets.ALIAS }}"
          keyStorePassword: "${{ secrets.KEY_STORE_PASSWORD }}"
          keyPassword: "${{ secrets.KEY_PASSWORD }}"
          appName: Shiru
          appVersion: ${{ env.APP_VERSION }}
          appPrefix: android

      - name: Generate latest-android.yml
        run: |
          echo "version: ${{ env.APP_VERSION }}" | sed 's/^version: v/version: /' > latest-android.yml

      - name: Publish Android APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # signedFiles is a ':'-separated list - one path per built ABI.
          IFS=':' read -ra FILES <<< "${{ steps.sign_app.outputs.signedFiles }}"
          for f in "${FILES[@]}"; do
            if [ -n "$f" ]; then
              echo "uploading $(basename $f)"
              gh release upload --clobber "$APP_VERSION" "../$f"
            fi
          done
          echo "uploading latest-android.yml"
          gh release upload --clobber "$APP_VERSION" latest-android.yml

      - name: Clean Build Artifacts
        run: rm -rf ./build
