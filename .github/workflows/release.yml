name: Release

# Releases run two ways:
#   1. Push a tag like v6.8.1 (must match the version in hosts/tauri/tauri.conf.json).
#   2. Manual dispatch with the confirmation box ticked.
# Either way it runs full CI first, then drafts a GitHub Release and uploads one
# artifact set per platform: Windows (MSI + NSIS), macOS (universal DMG), Linux
# (AppImage + deb) and Android (arm64 + armv7 APKs). Publishing the draft is a
# manual step on the Releases page - that is the moment users (and the in-app
# updater) can see it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_confirmed:
        description: 'I have verified the version in hosts/tauri/tauri.conf.json and confirm this release is intentional'
        required: true
        default: false
        type: boolean

env:
  BUN_VERSION: '1.3.14'
  RUST_VERSION: '1.89.0'
  # Linux Tauri build deps, shared by the desktop job and BUILDING.md.
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  # Releases are gated on the same CI that runs on every push.
  ci:
    if: ${{ github.event_name == 'push' || inputs.version_confirmed == true }}
    uses: ./.github/workflows/ci.yml

  prepare-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.read_version.outputs.app_version }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Read Release Version
        id: read_version
        run: |
          VERSION=$(jq -r .version hosts/tauri/tauri.conf.json)
          echo "app_version=v$VERSION" >> $GITHUB_OUTPUT
          echo "App Version: v$VERSION"

      - name: Verify tag matches app version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "${{ steps.read_version.outputs.app_version }}" ]; then
            echo "::error::Tag $TAG does not match hosts/tauri/tauri.conf.json version ${{ steps.read_version.outputs.app_version }} - bump the version and re-tag."
            exit 1
          fi

      - name: Prepare GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.read_version.outputs.app_version }}"
          PRERELEASE_FLAG=""
          if [[ "$APP_VERSION" == *"beta"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$APP_VERSION" > /dev/null 2>&1; then
            echo "Release $APP_VERSION not found, creating draft..."
            gh release create "$APP_VERSION" --draft $PRERELEASE_FLAG --title "${APP_VERSION#v}" --notes ""
          else
            echo "Release $APP_VERSION already exists, skipping creation."
          fi

  release-desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the AppImage inherits the builder's glibc,
          # so building on the newest Ubuntu would refuse to start on older ones.
          - name: Linux
            os: ubuntu-22.04
            targets: ''
            bundles: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
            updater: target/release/bundle/appimage/*.AppImage.sig
          - name: Windows
            os: windows-latest
            targets: ''
            bundles: target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe
            updater: target/release/bundle/nsis/*-setup.exe.sig
          - name: macOS
            os: macos-latest
            targets: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater: target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      # tauri.conf.json declares the bundle targets; beforeBuildCommand is empty
      # because the frontend is already in dist/web by this point.
      #
      # The updater is switched on by the repository variable TAURI_PUBKEY: with it
      # set, the build compiles that key in and emits signed updater artifacts, and
      # without it the release is simply not self-updating. See docs/CI.md#updater.
      - name: Build bundles
        shell: bash
        working-directory: hosts/tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_PUBKEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            cargo tauri build ${{ matrix.targets }} --config "{\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$PUBKEY\",\"endpoints\":[\"https://github.com/${{ github.repository }}/releases/latest/download/latest.json\"]}}}"
          else
            echo "TAURI_PUBKEY is not set: building without in-app updates"
            cargo tauri build ${{ matrix.targets }}
          fi

      - name: Publish bundles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(${{ matrix.bundles }})
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No bundles were produced for ${{ matrix.name }}"
            exit 1
          fi
          # the updater artifacts and their signatures ride along when signing is on
          FILES+=(${{ matrix.updater }})
          for f in "${FILES[@]}"; do
            echo "uploading $(basename "$f")"
            gh release upload --clobber "$APP_VERSION" "$f"
          done

  release-android:
    name: Android
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      NDK_VERSION: '27.2.12479018'

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null

      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      # armv7 covers 32-bit TV boxes; the same APK serves phone and Android TV.
      - name: Build Android APKs
        working-directory: hosts/tauri
        run: cargo tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Sign Android APKs
        id: sign_app
        uses: RockinChaos/sign-android@v1.1.0
        with:
          releaseDir: hosts/tauri/gen/android/app/build/outputs/apk/release
          signingKey: "${{ secrets.SIGNING_KEY }}"
          keyAlias: "${{ secrets.ALIAS }}"
          keyStorePassword: "${{ secrets.KEY_STORE_PASSWORD }}"
          keyPassword: "${{ secrets.KEY_PASSWORD }}"
          appName: zeroShiru
          appVersion: ${{ env.APP_VERSION }}
          appPrefix: android

      - name: Publish Android APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # signedFiles is a ':'-separated list - one path per built ABI.
          IFS=':' read -ra FILES <<< "${{ steps.sign_app.outputs.signedFiles }}"
          for f in "${FILES[@]}"; do
            if [ -n "$f" ]; then
              echo "uploading $(basename $f)"
              gh release upload --clobber "$APP_VERSION" "$f"
            fi
          done

  # The manifest the in-app updater reads: one entry per platform, each naming the
  # artifact to download and the signature it must match. Assembled from what the
  # platform jobs actually uploaded, so a platform that failed to build is absent
  # rather than pointing at nothing.
  update-manifest:
    name: Update Manifest
    needs: [prepare-release, release-desktop]
    if: ${{ vars.TAURI_PUBKEY != '' }}
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Build latest.json from the uploaded assets
        run: |
          set -euo pipefail
          VERSION="${APP_VERSION#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${APP_VERSION}"
          mkdir -p manifest && cd manifest
          gh release download "$APP_VERSION" --repo "${{ github.repository }}" --pattern '*.sig' --clobber
          PLATFORMS=""
          add() { # platform key, artifact suffix
            local sig
            sig=$(ls *"$2".sig 2>/dev/null | head -1 || true)
            [ -z "$sig" ] && { echo "no signature for $1, skipping"; return; }
            local asset="${sig%.sig}"
            PLATFORMS="$PLATFORMS{\"$1\":{\"signature\":\"$(cat "$sig")\",\"url\":\"$BASE/$(printf %s "$asset" | jq -sRr @uri)\"}},"
          }
          add linux-x86_64 .AppImage
          add windows-x86_64 -setup.exe
          add darwin-universal .app.tar.gz
          if [ -z "$PLATFORMS" ]; then
            echo "::error::signing is enabled but no signed artifacts were uploaded"
            exit 1
          fi
          # merge the per-platform objects into one, and stamp the release
          echo "[${PLATFORMS%,}]" | jq --arg version "$VERSION" \
            --arg notes "See the release notes." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: (add)}' > latest.json
          cat latest.json
          gh release upload --clobber "$APP_VERSION" latest.json
