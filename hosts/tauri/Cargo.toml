[package]
name = "shiru-tauri"
version = "6.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shiru desktop host (Tauri)"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
shiru-domain = { path = "../../crates/domain" }
shiru-core = { path = "../../crates/core" }
shiru-debrid = { path = "../../crates/debrid", features = ["native"] }
shiru-networking = { path = "../../crates/networking", features = ["native"] }
# page requests the webview cannot make itself, see src/net.rs
reqwest = { workspace = true }
shiru-media = { path = "../../crates/media" }
shiru-torrent = { path = "../../crates/torrent", features = ["native"] }
shiru-platform-contracts = { path = "../../crates/platform-contracts" }
tauri-plugin-dialog = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
url = "2"
# the art cache: content-addressed filenames and the scheme's percent-decoding
sha2 = "0.10"
percent-encoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# stderr is the only place WebKit says it cannot draw, see src/graphics.rs
libc = "0.2"
# the same gtk tao uses, to undo the client-side titlebar it forces on Wayland
gtk = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5"
tauri-plugin-updater = "2"
discord-rich-presence = "1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
default = []
# `cargo tauri build` turns this on for bundles. A plain `cargo build` without it
# is a DEV binary: it renders the Vite dev server on :5173 (what scripts/dev.sh
# wants), not the embedded frontend. Building a standalone production binary by
# hand therefore needs `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
