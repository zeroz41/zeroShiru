name: zeroshiru
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  # Local 2.0.1 patch: Linux creates its EGL bootstrap context from the GTK
  # window instead of assuming Flutter left one current on the platform thread.
  media_kit_video:
    path: third_party/media_kit_video
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/zeroshiru-mark.png

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
